# Crash test for the CIFS identity modes: rustfs is killed with SIGKILL at a
# random point of one operation per round, restarted and checked; fault
# "power" also drops what the Samba server had not made durable. The binary
# comes from the newest "CIFS Matrix" run of this branch that still has its
# build artifact, so this workflow does not compile anything.

name: CIFS Crash

on:
  workflow_dispatch:
  push:
    branches: [ cifs-compat ]
    paths:
      - .github/workflows/cifs-crash.yml
      - scripts/cifs-matrix/run-matrix-cell.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: cifs-crash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crash:
    name: ${{ matrix.fault }} / ${{ matrix.op }} / ${{ matrix.cell.identity }} / ${{ matrix.cell.fs }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fault: [ kill, power ]
        op: [ put, overwrite, multipart, start ]
        cell:
          - { identity: content, fs: cifs-noserverino }
          - { identity: inode, fs: cifs-serverino }
          - { identity: inode, fs: local }
        exclude:
          # A power cut is only run against object operations.
          - { fault: power, op: start }
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Download branch binary from the newest CIFS Matrix run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rustfs-bin"
          found=""
          while read -r id sha; do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" \
                --name rustfs-branch-binary --dir "$RUNNER_TEMP/rustfs-bin" 2>/dev/null; then
              found="$id $sha"
              break
            fi
          done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow cifs-matrix.yml \
            --branch cifs-compat --limit 20 --json databaseId,headSha \
            --jq '.[] | "\(.databaseId) \(.headSha)"')
          test -n "$found"
          echo "binary from run/commit: $found" | tee -a "$GITHUB_STEP_SUMMARY"
          chmod +x "$RUNNER_TEMP/rustfs-bin/rustfs"

      - name: Run crash cell
        env:
          TARGET: ${{ matrix.fault }}-${{ matrix.op }}-${{ matrix.cell.identity }}
          FS: ${{ matrix.cell.fs }}
          CELL_MODE: crash
          CRASH_OP: ${{ matrix.op }}
          CRASH_FAULT: ${{ matrix.fault }}
          CRASH_ITERATIONS: "100"
          RUSTFS_EXTRA_ENV: RUSTFS_FS_IDENTITY_MODE=${{ matrix.cell.identity }} RUSTFS_ISSUE3031_DIAG_ENABLE=true
        run: |
          bash scripts/cifs-matrix/run-matrix-cell.sh \
            "$TARGET" "$FS" "$RUNNER_TEMP/rustfs-bin/rustfs" \
            "$GITHUB_WORKSPACE/cifs-crash-out"

      - name: Upload cell results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cifs-crash-${{ matrix.fault }}-${{ matrix.op }}-${{ matrix.cell.identity }}-${{ matrix.cell.fs }}
          path: cifs-crash-out
          if-no-files-found: warn
          retention-days: 14
